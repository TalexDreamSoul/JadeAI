services:
  jadeai:
    image: ${JADEAI_IMAGE:?JADEAI_IMAGE is required}
    container_name: ${CONTAINER_NAME:?CONTAINER_NAME is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_MODE: ${AUTH_MODE:-oidc-with-admin-password}
      AUTH_URL: ${AUTH_URL:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      APP_URL: ${APP_URL:-}
      AUTH_OIDC_ENABLED: ${AUTH_OIDC_ENABLED:-false}
      AUTH_OIDC_NAME: ${AUTH_OIDC_NAME:-OIDC}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      AUTH_PASSWORD_PUBLIC_ENABLED: ${AUTH_PASSWORD_PUBLIC_ENABLED:-false}
      AUTH_PASSWORD_REGISTER_ENABLED: ${AUTH_PASSWORD_REGISTER_ENABLED:-false}
      AUTH_ADMIN_PASSWORD_ENABLED: ${AUTH_ADMIN_PASSWORD_ENABLED:-true}
      AUTH_FIRST_OIDC_USER_ADMIN: ${AUTH_FIRST_OIDC_USER_ADMIN:-false}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-zh}
      DB_TYPE: ${DB_TYPE:-postgresql}
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-qiniu}
      QINIU_STORAGE_ENABLED: ${QINIU_STORAGE_ENABLED:-false}
      QINIU_ACCESS_KEY: ${QINIU_ACCESS_KEY:-}
      QINIU_SECRET_KEY: ${QINIU_SECRET_KEY:-}
      QINIU_BUCKET: ${QINIU_BUCKET:-}
      QINIU_REGION: ${QINIU_REGION:-z0}
      QINIU_DOMAIN: ${QINIU_DOMAIN:-}
      QINIU_PROTOCOL: ${QINIU_PROTOCOL:-https}
      QINIU_KEY_PREFIX: ${QINIU_KEY_PREFIX:-uploads}
      QINIU_PUBLIC_READ: ${QINIU_PUBLIC_READ:-true}
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ENV: ${APP_ENV}
      APP_VERSION: ${APP_VERSION:-latest}
      GIT_SHA: ${GIT_SHA:-unknown}
      RESUME_ANALYSIS_WORKER_TOKEN: ${RESUME_ANALYSIS_WORKER_TOKEN:-}
    networks:
      - app-net
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/ready >/dev/null 2>&1 || wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  jadeai-worker:
    image: ${JADEAI_IMAGE:?JADEAI_IMAGE is required}
    container_name: ${CONTAINER_NAME:?CONTAINER_NAME is required}-worker
    restart: unless-stopped
    depends_on:
      jadeai:
        condition: service_healthy
    environment:
      RESUME_ANALYSIS_WORKER_ID: ${CONTAINER_NAME:?CONTAINER_NAME is required}-worker
      RESUME_ANALYSIS_WORKER_TOKEN: ${RESUME_ANALYSIS_WORKER_TOKEN:-}
      RESUME_ANALYSIS_TICK_TIMEOUT_MS: ${RESUME_ANALYSIS_TICK_TIMEOUT_MS:-10000}
    command:
      - /bin/sh
      - -lc
      - |
        while true; do
          node -e "(async()=>{const timeout=Number(process.env.RESUME_ANALYSIS_TICK_TIMEOUT_MS||10000);try{const res=await fetch('http://jadeai:3000/api/internal/resume-analysis/tick',{method:'POST',signal:AbortSignal.timeout(timeout),headers:{'x-worker-id':process.env.RESUME_ANALYSIS_WORKER_ID||'','x-worker-token':process.env.RESUME_ANALYSIS_WORKER_TOKEN||''}});if(!res.ok){const body=await res.text().catch(()=>'');console.error('[resume-analysis-worker] tick failed status='+res.status+' body='+body.slice(0,500));}}catch(error){console.error('[resume-analysis-worker] tick request failed:',error?.message||error)}})()"
          sleep "$${RESUME_ANALYSIS_POLL_INTERVAL_SECONDS:-3}"
        done
    healthcheck:
      disable: true
    networks:
      - app-net

networks:
  app-net:
    external: true
