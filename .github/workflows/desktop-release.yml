name: JadeAI Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag, for example v0.4.2
        required: true
        type: string
      draft:
        description: Create a draft release for final operator review
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean

concurrency:
  group: jadeai-desktop-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    environment: desktop-release
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate version and signing configuration
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          if [ "${{ inputs.release_tag }}" != "v${package_version}" ]; then
            echo "Release tag must match package.json: expected v${package_version}" >&2
            exit 1
          fi
          if [ -z "${CSC_LINK:-}" ] || [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            echo "CSC_LINK and CSC_KEY_PASSWORD are required" >&2
            exit 1
          fi

          if [ -n "${APPLE_API_KEY_P8:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
            api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
            umask 077
            printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
            echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
          elif [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "Configure either App Store Connect API credentials or Apple ID notarization credentials" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates
        run: |
          pnpm type-check
          pnpm test
          pnpm lint
          pnpm smoke:commercial
          pnpm build

      - name: Build signed and notarized universal macOS artifacts
        run: |
          pnpm build:desktop
          pnpm exec electron-builder --config config/electron-builder.config.cjs --mac --universal --publish never

      - name: Verify packaged applications and update artifacts
        shell: bash
        run: |
          set -euo pipefail

          app_count=0
          while IFS= read -r -d '' app_path; do
            app_count=$((app_count + 1))
            codesign --verify --deep --strict --verbose=2 "$app_path"
            spctl --assess --type execute --verbose=2 "$app_path"
            xcrun stapler validate "$app_path"
          done < <(find release -type d -name 'JadeAI.app' -prune -print0)
          if [ "$app_count" -eq 0 ]; then
            echo "No packaged JadeAI.app was found" >&2
            exit 1
          fi

          test -n "$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.zip' -print -quit)"
          test -f release/latest-mac.yml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: JadeAI ${{ inputs.release_tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
