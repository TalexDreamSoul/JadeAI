name: JadeAI Quality And Deployment

on:
  push:
    branches:
      - main
      - preview
  pull_request:
    branches:
      - main
      - preview
  workflow_dispatch:
    inputs:
      target_environment:
        description: Deployment environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  group: jadeai-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # Override with repository variable GHCR_IMAGE_NAME if you want a different package name.
  DEFAULT_IMAGE_NAME: jadeai-resume

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jadeai
          POSTGRES_PASSWORD: jadeai-test
          POSTGRES_DB: jadeai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jadeai -d jadeai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Commercial smoke tests
        run: pnpm smoke:commercial

      - name: PostgreSQL integration
        env:
          NODE_ENV: test
          DB_TYPE: postgresql
          DATABASE_URL: postgresql://jadeai:jadeai-test@127.0.0.1:5432/jadeai_test
          ALLOW_POSTGRES_INTEGRATION_TESTS: "true"
          AUTH_ENABLED: "false"
          AUTH_SECRET: postgres-integration-only-secret
          ALLOW_MOCK_PAYMENTS: "true"
          DATA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: pnpm smoke:postgres

      - name: Production build
        run: pnpm build

  build-and-trigger:
    needs: quality
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'preview')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'preview' || inputs.target_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve environment and image tags
        id: resolve
        shell: bash
        env:
          GHCR_IMAGE_NAME: ${{ vars.GHCR_IMAGE_NAME }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME}"
          short_sha="${GITHUB_SHA::7}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_name="${GHCR_IMAGE_NAME:-$DEFAULT_IMAGE_NAME}"
          image_name="${image_name,,}"
          env_name="${TARGET_ENVIRONMENT:-preview}"

          case "$env_name" in
            production)
              if [ "$branch" != "main" ]; then
                echo "Production deployments must be dispatched from main, got: $branch" >&2
                exit 1
              fi
              domain="resume.wc1.tagzxia.com"
              ;;
            preview)
              domain="resume-preview.wc1.tagzxia.com"
              ;;
            *)
              echo "Unsupported deployment environment: $env_name" >&2
              exit 1
              ;;
          esac

          image_repo="ghcr.io/${owner}/${image_name}"
          immutable_tag="${env_name}-${short_sha}-${GITHUB_RUN_NUMBER}"
          latest_tag="${env_name}-latest"
          image="${image_repo}:${immutable_tag}"
          latest_image="${image_repo}:${latest_tag}"

          {
            echo "branch=$branch"
            echo "short_sha=$short_sha"
            echo "env_name=$env_name"
            echo "domain=$domain"
            echo "image_repo=$image_repo"
            echo "immutable_tag=$immutable_tag"
            echo "latest_tag=$latest_tag"
            echo "image=$image"
            echo "latest_image=$latest_image"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved image: $image"
          echo "Resolved latest: $latest_image"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.resolve.outputs.image }}
            ${{ steps.resolve.outputs.latest_image }}
          labels: |
            org.opencontainers.image.title=JadeAI Resume
            org.opencontainers.image.description=JadeAI resume deployment image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.resolve.outputs.immutable_tag }}
          build-args: |
            APP_VERSION=${{ steps.resolve.outputs.immutable_tag }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public (best effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPO: ${{ steps.resolve.outputs.image_repo }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          set -euo pipefail
          path="${IMAGE_REPO#ghcr.io/}"
          owner="${path%%/*}"
          package="${path#*/}"
          package="${package##*/}"
          echo "Trying to set GHCR package visibility to public: owner=$owner package=$package"
          if [ "$OWNER_TYPE" = "Organization" ]; then
            gh api --method PATCH "/orgs/$owner/packages/container/$package/visibility" -f visibility=public || true
          else
            gh api --method PATCH "/user/packages/container/$package/visibility" -f visibility=public || true
          fi

      - name: Trigger Jenkins deploy
        shell: bash
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_JOB_NAME: ${{ vars.JENKINS_JOB_NAME || 'jadeai-deploy' }}
          JENKINS_JOB_TOKEN: ${{ secrets.JENKINS_JOB_TOKEN }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          IMAGE: ${{ steps.resolve.outputs.image }}
          ENV_NAME: ${{ steps.resolve.outputs.env_name }}
          DOMAIN: ${{ steps.resolve.outputs.domain }}
        run: |
          set -euo pipefail

          required=(JENKINS_URL JENKINS_JOB_NAME JENKINS_JOB_TOKEN JENKINS_USER JENKINS_API_TOKEN)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required Jenkins configuration: $name" >&2
              exit 1
            fi
          done

          base_url="${JENKINS_URL%/}"
          job_path=""
          IFS='/' read -ra parts <<< "$JENKINS_JOB_NAME"
          for part in "${parts[@]}"; do
            [ -z "$part" ] && continue
            job_path="${job_path}/job/${part}"
          done

          trigger_url="${base_url}${job_path}/buildWithParameters?token=${JENKINS_JOB_TOKEN}"
          crumb_header=()
          if crumb_json="$(curl -fsS --user "${JENKINS_USER}:${JENKINS_API_TOKEN}" "${base_url}/crumbIssuer/api/json" 2>/dev/null)"; then
            crumb_field="$(printf '%s' "$crumb_json" | jq -r '.crumbRequestField // empty')"
            crumb="$(printf '%s' "$crumb_json" | jq -r '.crumb // empty')"
            if [ -n "$crumb_field" ] && [ -n "$crumb" ]; then
              crumb_header=(-H "${crumb_field}: ${crumb}")
            fi
          fi

          curl -fsS -X POST "${trigger_url}" \
            --user "${JENKINS_USER}:${JENKINS_API_TOKEN}" \
            "${crumb_header[@]}" \
            --data-urlencode "BRANCH=${GITHUB_REF_NAME}" \
            --data-urlencode "ENV_NAME=${ENV_NAME}" \
            --data-urlencode "IMAGE=${IMAGE}" \
            --data-urlencode "DOMAIN=${DOMAIN}" \
            --data-urlencode "COMMIT_SHA=${GITHUB_SHA}" \
            --data-urlencode "GITHUB_RUN_NUMBER=${GITHUB_RUN_NUMBER}" \
            --data-urlencode "GITHUB_RUN_ID=${GITHUB_RUN_ID}"

          echo "Triggered Jenkins deploy: env=${ENV_NAME} image=${IMAGE}"
