name: Legacy Manual GHCR Publish

# Legacy manual publisher kept for emergency/manual image publishing only.
# Automatic master/preview deployments are handled by docker-ghcr-deploy.yml -> Jenkins.
on:
  workflow_dispatch:

concurrency:
  group: legacy-docker-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-publish-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare image name
        id: image
        env:
          GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}
        run: |
          set -euo pipefail
          image="${GHCR_IMAGE:-}"
          if [ -z "$image" ]; then
            image="ghcr.io/${GITHUB_REPOSITORY,,}"
          fi
          image="${image,,}"
          if [[ "$image" != ghcr.io/* ]]; then
            echo "GHCR image must start with ghcr.io/: $image" >&2
            exit 1
          fi
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "package=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "image=$image"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=JadeAI
            org.opencontainers.image.description=AI Resume Builder
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push GHCR image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public (best effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          set -euo pipefail
          path="${IMAGE#ghcr.io/}"
          owner="${path%%/*}"
          package="${path#*/}"
          package="${package##*/}"
          echo "Trying to set GHCR package visibility to public: owner=$owner package=$package"
          if [ "$OWNER_TYPE" = "Organization" ]; then
            gh api --method PATCH "/orgs/$owner/packages/container/$package/visibility" -f visibility=public || true
          else
            gh api --method PATCH "/user/packages/container/$package/visibility" -f visibility=public || true
          fi

      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            Docker image: `${{ steps.image.outputs.name }}:${{ github.ref_name }}`
            Digest: `${{ steps.build.outputs.digest }}`
          generate_release_notes: true
