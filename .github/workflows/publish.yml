name: Build, Publish & Deploy

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-publish-deploy
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-publish-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare image name
        id: image
        env:
          GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}
        run: |
          set -euo pipefail
          image="${GHCR_IMAGE:-}"
          if [ -z "$image" ]; then
            image="ghcr.io/${GITHUB_REPOSITORY,,}"
          fi
          image="${image,,}"
          if [[ "$image" != ghcr.io/* ]]; then
            echo "GHCR image must start with ghcr.io/: $image" >&2
            exit 1
          fi
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "package=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "image=$image"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=JadeAI
            org.opencontainers.image.description=AI Resume Builder
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push GHCR image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public (best effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          set -euo pipefail
          path="${IMAGE#ghcr.io/}"
          owner="${path%%/*}"
          package="${path#*/}"
          package="${package##*/}"
          echo "Trying to set GHCR package visibility to public: owner=$owner package=$package"
          if [ "$OWNER_TYPE" = "Organization" ]; then
            gh api --method PATCH "/orgs/$owner/packages/container/$package/visibility" -f visibility=public || true
          else
            gh api --method PATCH "/user/packages/container/$package/visibility" -f visibility=public || true
          fi

      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            Docker image: `${{ steps.image.outputs.name }}:${{ github.ref_name }}`
            Digest: `${{ steps.build.outputs.digest }}`
          generate_release_notes: true

      - name: Trigger 1Panel webhook
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          ONEPANEL_WEBHOOK_URL: ${{ secrets.ONEPANEL_WEBHOOK_URL }}
          ONEPANEL_WEBHOOK_TOKEN: ${{ secrets.ONEPANEL_WEBHOOK_TOKEN }}
          ONEPANEL_WEBHOOK_SECRET: ${{ secrets.ONEPANEL_WEBHOOK_SECRET }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ -z "${ONEPANEL_WEBHOOK_URL:-}" ]; then
            echo "ONEPANEL_WEBHOOK_URL is not configured; skip deploy webhook."
            exit 0
          fi

          image_ref="$IMAGE@$DIGEST"
          payload="$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg ref_name "$REF_NAME" \
            --arg ref_type "$REF_TYPE" \
            --arg image "$IMAGE" \
            --arg image_ref "$image_ref" \
            --arg digest "$DIGEST" \
            --arg secret "${ONEPANEL_WEBHOOK_SECRET:-}" \
            '{repository:$repository, sha:$sha, ref:$ref, refName:$ref_name, refType:$ref_type, image:$image, imageRef:$image_ref, digest:$digest, secret:$secret}')"

          headers=(-H "Content-Type: application/json")
          if [ -n "${ONEPANEL_WEBHOOK_TOKEN:-}" ]; then
            headers+=( -H "Authorization: Bearer $ONEPANEL_WEBHOOK_TOKEN" )
          fi

          curl --fail-with-body -X POST "${headers[@]}" -d "$payload" "$ONEPANEL_WEBHOOK_URL"
