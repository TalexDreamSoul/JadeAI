<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>JadeAI 启动失败</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:14px system-ui;background:#fafaf9;color:#292524}main{max-width:36rem;padding:2rem}pre{white-space:pre-wrap;word-break:break-word;padding:1rem;background:#f5f5f4;border:1px solid #e7e5e4;border-radius:6px}button{font:inherit;padding:.5rem 1rem;margin-right:.5rem;border:1px solid #d6d3d1;border-radius:4px;background:#fff;cursor:pointer}button:hover{background:#f5f5f4}[hidden]{display:none}</style></head><body><main><h1>JadeAI 暂时无法连接</h1><p>请检查网络或本地服务后重试。</p><pre id="detail"></pre><button id="retry">重试</button><button id="open" hidden>打开数据目录</button></main><script>const params=new URLSearchParams(location.search);document.getElementById('detail').textContent=params.get('detail')||'无详情';document.getElementById('retry').onclick=()=>window.jade?.retryStartup();const open=document.getElementById('open');if(params.get('local')==='1')open.hidden=false;open.onclick=()=>window.jade?.openDataDir();</script></body></html>
